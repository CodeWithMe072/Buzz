version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: loadtest_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: loadtest_redis
    ports:
      - "6379:6379"

  app-1:
    build: .
    container_name: loadtest_app_1
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/buzz
      - REDIS_URL=redis://redis:6379
      - MONGO_MAX_POOL_SIZE=100
      - NODE_ENV=development
    depends_on:
      - mongodb
      - redis

  app-2:
    build: .
    container_name: loadtest_app_2
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/buzz
      - REDIS_URL=redis://redis:6379
      - MONGO_MAX_POOL_SIZE=100
      - NODE_ENV=development
    depends_on:
      - mongodb
      - redis

  nginx:
    image: nginx:alpine
    container_name: loadtest_nginx
    volumes:
      - ./nginx.loadtest.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app-1
      - app-2

volumes:
  mongodb_data:
